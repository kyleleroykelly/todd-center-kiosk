name: Update directory

on:
  schedule:
    - cron: "15 7 * * *"   # nightly, about 3 AM Eastern (time is UTC)
  workflow_dispatch:        # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-repo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the LMC directory
        run: node scripts/fetch-directory.mjs
      - name: Save directory.json if it changed
        run: |
          if git diff --quiet -- directory.json && git ls-files --error-unmatch directory.json >/dev/null 2>&1; then
            echo "No changes to directory.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add directory.json
          git commit -m "Update directory"
          git pull --rebase
          git push
