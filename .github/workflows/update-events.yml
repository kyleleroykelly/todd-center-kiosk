name: Update Todd Center events

on:
  schedule:
    - cron: "*/30 0-2,10-23 * * *"  # every 30 minutes, about 6 AM to 10 PM Eastern (times are UTC)
    - cron: "5 4,5 * * *"          # just after midnight Eastern (EDT and EST) for the new day
  workflow_dispatch:              # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the LMC calendar
        run: node scripts/fetch-events.mjs
      - name: Save events.json if it changed
        run: |
          if git diff --quiet -- events.json && git ls-files --error-unmatch events.json >/dev/null 2>&1; then
            echo "No changes to events.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Update Todd Center events"
          git pull --rebase
          git push
